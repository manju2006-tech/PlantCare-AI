{% extends "base.html" %} {% block title %}Log In{% endblock %} {% block content
%}
<div class="auth-wrap">
  <div class="glass-card auth-card">
    <div class="text-center">
      <div class="auth-icon"><i class="bi bi-shield-lock fs-3"></i></div>
      <h3 class="mb-1">Welcome back</h3>
      <p class="text-muted-custom mb-4">
        Log in to continue diagnosing your plants.
      </p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="mb-3">
        <label for="username" class="form-label form-label-custom"
          >Username or Email</label
        >
        <input
          type="text"
          class="form-control form-control-glass"
          id="username"
          name="username"
          value="{{ username or '' }}"
          placeholder="jane_doe or jane@example.com"
          required
          autofocus
        />
      </div>

      <div class="mb-3">
          <label for="password" class="form-label form-label-custom">
          Password
          </label>

        <div class="password-input-wrapper">
        <input
            type="password"
            class="form-control form-control-glass"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

          <button
            type="button"
            class="password-toggle"
            id="togglePassword"
            aria-label="Show password"
          >
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="remember"
            name="remember"
          />
          <label class="form-check-label small text-muted-custom" for="remember"
            >Remember me</label
          >
        </div>
      </div>

      <button type="submit" class="btn btn-plant w-100 mb-3">Log In</button>

      <p class="text-center text-muted-custom small mb-0">
        Don't have an account?
        <a href="{{ url_for('auth.register') }}" class="fw-bold"
          >Sign up free</a
        >
      </p>
    </form>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    if (!passwordInput || !togglePassword) {
        return;
    }

    const icon = togglePassword.querySelector("i");

    togglePassword.addEventListener("click", function () {
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
            togglePassword.setAttribute("aria-label", "Hide password");
        } else {
            passwordInput.type = "password";
            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
            togglePassword.setAttribute("aria-label", "Show password");
        }

        passwordInput.focus();
    });
});
</script>
{% endblock %}
