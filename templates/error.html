{% extends "base.html" %} {% block title %}Error {{ code }}{% endblock %} {%
block content %}
<div class="auth-wrap">
  <div class="glass-card auth-card text-center">
    <div
      class="auth-icon mx-auto"
      style="
        background: linear-gradient(
          135deg,
          var(--color-disease),
          var(--color-disease-dark)
        );
      "
    >
      <i class="bi bi-exclamation-octagon fs-3"></i>
    </div>
    <h1 class="font-mono mb-2" style="font-size: 3rem">{{ code }}</h1>
    <p class="text-muted-custom mb-4">{{ message }}</p>
    <div class="d-flex gap-2 justify-content-center flex-wrap">
      <a href="{{ url_for('main.landing') }}" class="btn btn-plant"
        ><i class="bi bi-house me-2"></i>Go Home</a
      >
      {% if current_user.is_authenticated %}
      <a href="{{ url_for('main.dashboard') }}" class="btn btn-plant-outline"
        >Dashboard</a
      >
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
